<script>
    (function () {
        try {
            var d = document.documentElement;
            var get = function (k, def) {
                try { var v = localStorage.getItem(k); return v === null ? def : JSON.parse(v); }
                catch (e) { return def; }
            };
            var theme = get('ak_theme', 'system');
            var dark  = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
            d.classList.toggle('dark', dark);
            d.setAttribute('dir', get('ak_dir', 'ltr'));

            var accent = get('ak_accent', 'blue');
            d.dataset.accent = accent;

            var accMap = {
                blue: '221 83% 53%',
                violet: '262 83% 58%',
                green: '142 71% 45%',
                rose: '347 77% 50%',
                red: '347 77% 50%',
                orange: '25 95% 53%',
                amber: '38 92% 50%',
                teal: '173 80% 40%',
                midnight: '222 47% 11%',
                black: '222 47% 11%'
            };
            if (accent === 'midnight' || accent === 'black') {
                d.style.setProperty('--primary', '222 47% 11%');
                d.style.setProperty('--primary-foreground', '0 0% 100%');
                d.style.setProperty('--ring', '222 47% 11%');
                d.style.setProperty('--sidebar-primary', '222 47% 11%');
            } else if (accMap[accent]) {
                d.style.setProperty('--primary', accMap[accent]);
                d.style.setProperty('--ring', accMap[accent]);
                d.style.setProperty('--sidebar-primary', accMap[accent]);
            }

            d.dataset.radius       = get('ak_radius',    'lg');
            d.dataset.layout       = get('ak_layout',    'vertical');
            d.dataset.sidebarColor = get('ak_sb_color', 'dark');
            d.dataset.sidebarStyle = get('ak_sb_style', 'tree');
            d.dataset.navbarColor  = get('ak_nb_color', 'default');
            d.dataset.cardAnimation = get('ak_card_animation', 'fade-up');
            d.dataset.pageLoading  = get('ak_page_loading', false);
            d.dataset.layoutFluid = get('ak_layout_fluid', false);
            d.dataset.curvedLayout = get('ak_curved_layout', true);

            d.style.setProperty('--custom-sb-grad-from', get('ak_sb_grad_from', '#1e1b4b'));
            d.style.setProperty('--custom-sb-grad-to',   get('ak_sb_grad_to',   '#0f172a'));
            d.style.setProperty('--custom-nb-grad-from', get('ak_nb_grad_from', '#1e1b4b'));
            d.style.setProperty('--custom-nb-grad-to',   get('ak_nb_grad_to',   '#0f172a'));
            d.classList.toggle('sidebar-collapsed', get('ak_sb_collapsed', false));
            if (get('ak_compact', false)) d.classList.add('is-compact');
        } catch (e) {}
    })();
</script>

            <div x-data="{
                    code: ['', '', '', '', '', ''],
                    left: 30,
                    get filled() { return this.code.every(c => c !== '') },
                    onInput(i, e) {
                        const v = e.target.value.replace(/\D/g, '').slice(-1);
                        this.code[i] = v; e.target.value = v;
                        if (v && i < 5) e.target.parentElement.children[i + 1].focus();
                        if (this.filled) this.verify();
                    },
                    onKey(i, e) {
                        if (e.key === 'Backspace' && ! this.code[i] && i > 0) e.target.parentElement.children[i - 1].focus();
                    },
                    onPaste(e) {
                        const digits = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6).split('');
                        if (! digits.length) return;
                        e.preventDefault();
                        const boxes = e.target.parentElement.children;
                        digits.forEach((d, i) => { this.code[i] = d; boxes[i].value = d });
                        boxes[Math.min(digits.length, 5)].focus();
                        if (this.filled) this.verify();
                    },
                    verify() { window.toast('Code verified — welcome back!', { variant: 'success' }) },
                    resend() { if (this.left > 0) return; this.left = 30; window.toast('A new code is on its way'); },
                 }"

    <div
    x-data="{
        toasts: [],
        add(detail) {
            const id = Date.now() + Math.random();
            const pos = detail.position || 'bottom-end';
            this.toasts.push({ id, position: pos, ...detail });
            const d = detail.duration ?? 4200;
            if (d > 0) setTimeout(() => this.remove(id), d);
        },
        remove(id) { this.toasts = this.toasts.filter(t => t.id !== id); },
        at(pos) { return this.toasts.filter(t => t.position === pos); },
        style(v) {
            return {
                success: 'border-success/30 text-success',
                warning: 'border-warning/40 text-[hsl(var(--warning))]',
                destructive: 'border-destructive/30 text-destructive',
                info: 'border-info/30 text-info',
                default: 'border-border text-foreground',
            }[v] || 'border-border text-foreground';
        },
        icon(v) {
            return { success:'circle-check-big', warning:'triangle-alert', destructive:'circle-alert', info:'info', default:'bell' }[v] || 'bell';
        },
    }"
    @toast.window="add($event.detail); $nextTick(() => window.renderIcons && window.renderIcons())"
